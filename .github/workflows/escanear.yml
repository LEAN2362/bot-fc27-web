name: Bot Recolector FC27 24/7

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-base:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Descargar el repositorio
      uses: actions/checkout@v4

    - name: 🌐 Instalar Google Chrome para DrissionPage
      uses: browser-actions/setup-chrome@v1

    - name: 🐍 Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 📦 Instalar dependencias completas
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install DrissionPage google-genai requests openpyxl gspread pandas

    - name: 🚀 Ejecutar el bot recolector
      run: python bot_fc27.py auto

    - name: 💾 Guardar precios actualizados directo en GitHub
      run: |
        git config --global user.name "Bot FC27 Auto"
        git config --global user.email "bot@fc27.local"
        git add Lista_Jugadores_FC27.xlsx
        git commit -m "🔄 Actualización automática de precios FC27" || echo "Sin cambios para subir"
        git pull --rebase origin main || true
        git push origin main
