name: Bot Recolector FC27 24/7

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  actualizar-base:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Descargar el repositorio
      uses: actions/checkout@v4

    - name: 🌐 Instalar Google Chrome para DrissionPage
      uses: browser-actions/setup-chrome@v1

    - name: 🐍 Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 📦 Instalar dependencias completas
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install DrissionPage google-genai requests openpyxl gspread pandas

    - name: 🔐 Crear archivo de credenciales de Google
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      run: |
        echo "$GCP_CREDENTIALS" > credenciales_google.json

    - name: 🚀 Ejecutar el bot recolector
      run: python bot_fc27.py auto
