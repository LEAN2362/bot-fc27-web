name: Bot Recolector FC27 24/7

on:
  schedule:
    - cron: '*/30 * * * *' # Se ejecuta cada 30 minutos automáticamente
  workflow_dispatch: # Te agrega un botón para ejecutarlo a mano cuando quieras

jobs:
  actualizar-base:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Descargar el repositorio
      uses: actions/checkout@v4

    - name: 🐍 Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 📦 Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🔐 Crear archivo de credenciales de Google
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      run: |
        echo "$GCP_CREDENTIALS" > credenciales_google.json

    - name: 🚀 Ejecutar el bot recolector
      run: python escanear.py
